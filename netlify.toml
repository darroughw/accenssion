# The site lives in web/. Studio (studio/) is deployed separately to sanity.studio.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # submission-created.mjs emails each contact-form request through Resend.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Set in the Netlify UI: PUBLIC_SANITY_PROJECT_ID, PUBLIC_SANITY_DATASET, RESEND_API_KEY.

# Long cache for fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
