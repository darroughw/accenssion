# The site lives in web/. Studio (studio/) is deployed separately to sanity.studio.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # PUBLIC_SANITY_PROJECT_ID / PUBLIC_SANITY_DATASET are set in the Netlify UI.

# Long cache for fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
